name: Luau extension

on:
  push:
    branches: [arena/01a0ba62-roblox]
    paths:
      - "extensions/luau_vm/**"
      - "tools/fetch_deps.py"
      - "tests/luau_smoke.gd"
      - ".github/workflows/luau-extension.yml"
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install "scons>=4.6"

      - name: Fetch Luau and godot-cpp
        run: python3 tools/fetch_deps.py

      - name: Build (template_release)
        working-directory: extensions/luau_vm
        run: scons -j"$(nproc)" platform=linux arch=x86_64 target=template_release api_version=4.7

      - name: Build (template_debug)
        working-directory: extensions/luau_vm
        run: scons -j"$(nproc)" platform=linux arch=x86_64 target=template_debug api_version=4.7

      - name: Show build output
        run: ls -la extensions/luau_vm/bin

      - uses: actions/upload-artifact@v4
        with:
          name: luau-vm-linux
          path: extensions/luau_vm/bin/*.so
          if-no-files-found: error

  smoke-linux:
    name: Smoke test on Godot 4.7.2
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: luau-vm-linux
          path: extensions/luau_vm/bin

      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Show the libraries Godot will load
        run: ls -la extensions/luau_vm/bin

      - name: Import project resources
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import || true

      - name: Run the Luau smoke test
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/luau_smoke.gd

  build-android:
    name: Build (android arm64)
    runs-on: ubuntu-latest
    # Android is a hard requirement for this project, but the NDK cross-build is
    # still being brought up: keep it visible without blocking the desktop
    # pipeline. Flip `continue-on-error` to false once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install "scons>=4.6"

      - name: Fetch Luau and godot-cpp
        run: python3 tools/fetch_deps.py

      - name: Locate the Android NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "using NDK: ${NDK:-<none>}"
          echo "ANDROID_NDK_ROOT=${NDK}" >> "$GITHUB_ENV"

      - name: Build (android arm64)
        working-directory: extensions/luau_vm
        run: scons -j"$(nproc)" platform=android arch=arm64 target=template_release api_version=4.7

      - uses: actions/upload-artifact@v4
        with:
          name: luau-vm-android
          path: extensions/luau_vm/bin/*.so
          if-no-files-found: error
