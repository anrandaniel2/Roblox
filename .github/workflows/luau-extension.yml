name: Luau extension

on:
  push:
    branches: [arena/01a0ba62-roblox]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: |
          mkdir -p .ci
          pip install "scons>=4.6" 2>&1 | tee .ci/luau-linux.log

      - name: Fetch Luau and godot-cpp
        run: python3 tools/fetch_deps.py 2>&1 | tee -a .ci/luau-linux.log

      - name: Build (template_release)
        working-directory: extensions/luau_vm
        run: |
          set -o pipefail
          scons -j"$(nproc)" platform=linux arch=x86_64 target=template_release api_version=4.7 \
            2>&1 | tee -a "$GITHUB_WORKSPACE/.ci/luau-linux.log"

      - name: Build (template_debug)
        working-directory: extensions/luau_vm
        run: |
          set -o pipefail
          scons -j"$(nproc)" platform=linux arch=x86_64 target=template_debug api_version=4.7 \
            2>&1 | tee -a "$GITHUB_WORKSPACE/.ci/luau-linux.log"

      - name: List build output
        run: ls -la extensions/luau_vm/bin 2>&1 | tee -a .ci/luau-linux.log

      - uses: actions/upload-artifact@v4
        with:
          name: luau-vm-linux
          path: extensions/luau_vm/bin/*.so
          if-no-files-found: error

      - name: Publish build log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish_log.sh .ci/luau-linux.log

  smoke-linux:
    name: Smoke test on Godot 4.7.2
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: luau-vm-linux
          path: extensions/luau_vm/bin

      - name: Install Godot 4.7.2
        run: |
          mkdir -p .ci
          {
            curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -q -o /tmp/godot.zip -d /tmp/godot
            chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
          } 2>&1 | tee .ci/luau-smoke.log

      - name: List the libraries Godot will load
        run: ls -la extensions/luau_vm/bin 2>&1 | tee -a .ci/luau-smoke.log

      - name: Import project resources
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee -a .ci/luau-smoke.log || true

      - name: Run the Luau smoke test
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/luau_smoke.gd \
            2>&1 | tee -a .ci/luau-smoke.log

      - name: Run the Roblox API smoke test
        run: |
          # The API layer needs the extension plus the project's autoloads, so it
          # runs as a scene rather than a script.
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/lua_api_smoke.tscn \
            2>&1 | tee -a .ci/luau-smoke.log

      - name: Publish smoke log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish_log.sh .ci/luau-smoke.log

  build-android:
    name: Build (android arm64)
    runs-on: ubuntu-latest
    # Android is a hard requirement, but the NDK cross-build is still being
    # brought up. Keep it visible without blocking desktop: flip
    # `continue-on-error` to false once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: |
          mkdir -p .ci
          pip install "scons>=4.6" 2>&1 | tee .ci/luau-android.log

      - name: Fetch Luau and godot-cpp
        run: python3 tools/fetch_deps.py 2>&1 | tee -a .ci/luau-android.log

      - name: Locate the Android NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "using NDK: ${NDK:-<none>}" | tee -a .ci/luau-android.log
          echo "ANDROID_NDK_ROOT=${NDK}" >> "$GITHUB_ENV"

      - name: Build (android arm64)
        working-directory: extensions/luau_vm
        run: |
          set -o pipefail
          # godot-cpp pins an NDK version of its own; tell it about the one the
          # runner actually has instead of its built-in default.
          NDK_VERSION="$(basename "${ANDROID_NDK_ROOT:-unknown}")"
          echo "building with ndk_version=${NDK_VERSION}" | tee -a "$GITHUB_WORKSPACE/.ci/luau-android.log"
          scons -j"$(nproc)" platform=android arch=arm64 target=template_release api_version=4.7 \
            "ndk_version=${NDK_VERSION}" 2>&1 | tee -a "$GITHUB_WORKSPACE/.ci/luau-android.log"

      - uses: actions/upload-artifact@v4
        with:
          name: luau-vm-android
          path: extensions/luau_vm/bin/*.so
          if-no-files-found: error

      - name: Publish build log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish_log.sh .ci/luau-android.log
